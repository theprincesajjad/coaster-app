<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Coaster</title>
<meta name="robots" content="noindex">
<script>
// GitHub Pages serves this page for any missing path. Invite links look like
// <base>/i/K7Q4-2MZD; send them to <base>/i/?c=K7Q4-2MZD (keeping ?n=Name) before anything paints.
(function () {
  var m = location.pathname.match(/^(.*\/)i\/([^\/?#]+)\/?$/);
  if (m) {
    var q = new URLSearchParams(location.search);
    q.set("c", decodeURIComponent(m[2]));
    location.replace(m[1] + "i/?" + q.toString());
  }
})();
</script>
<style>
  :root { --canvas:#FBF7F0; --ink:#2B1D18; --text-2:#6F655D; --accent:#E8472F; }
  @media (prefers-color-scheme: dark) { :root { --canvas:#1C1411; --ink:#F6EEE3; --text-2:#BDB0A3; --accent:#EE5A42; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--canvas); color:var(--ink);
         font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align:center; padding:0 16px; }
  h1 { font-family: Georgia, serif; font-weight:500; font-size:32px; margin:0 0 8px; }
  p { color:var(--text-2); margin:0 0 20px; }
  a { color:var(--ink); text-decoration-color:var(--accent); text-underline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1>Nothing on this shelf</h1>
  <p>That page doesn’t exist.</p>
  <a id="home" href="/coaster-app/">Back to Coaster</a>
</main>
</body>
</html>
